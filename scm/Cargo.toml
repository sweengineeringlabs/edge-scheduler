[package]
name         = "swe-edge-runtime-scheduler"
version      = "0.3.4"
edition      = "2021"
license      = "MIT OR Apache-2.0"
rust-version = "1.95"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/edge"
description  = "edge — async scheduler: runtime-agnostic Scheduler trait plus an optional tokio-backed implementation."
keywords     = ["scheduler", "runtime", "tokio", "executor", "swe"]
categories   = ["network-programming", "asynchronous"]

[package.metadata.struct-engine]
application_type = "lib"
service_type     = "scheduler"

[lib]
name = "swe_edge_runtime_scheduler"
path = "main/src/lib.rs"

[features]
default  = ["tokio-rt"]
tokio-rt = ["dep:tokio", "dep:serde"]

[dependencies]
tokio                  = { version = "1.0", features = ["rt-multi-thread", "signal", "sync", "time", "macros"], optional = true }
serde                  = { version = "1.0", features = ["derive"], optional = true }
tracing                = "0.1"
swe-edge-configbuilder = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git", tag = "v0.1.0" }

[dev-dependencies]
async-trait = "0.1"
edge-domain = { git = "https://github.com/sweengineeringlabs/edge-domain.git", tag = "v0.8.27" }
toml        = "0.8"
futures     = "0.3"

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
